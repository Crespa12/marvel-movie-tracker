          &lt;section class=&quot;game-card&quot; aria-labelledby=&quot;craft-title&quot;&gt;&lt;div class=&quot;game-card-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;game-kicker&quot;&gt;Usa los materiales recuperados&lt;/p&gt;&lt;h3 id=&quot;craft-title&quot;&gt;Taller de Stark&lt;/h3&gt;&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;shop-intro&quot;&gt;Desbloquea planos gradualmente al reunir materiales y avanzar en la guía.&lt;/p&gt;&lt;div class=&quot;item-list&quot; id=&quot;recipe-grid&quot;&gt;&lt;/div&gt;&lt;/section&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;section class=&quot;command-console&quot; aria-labelledby=&quot;command-title&quot;&gt;
        &lt;div class=&quot;command-console-head&quot;&gt;&lt;div&gt;&lt;p class=&quot;game-kicker&quot;&gt;Consola de S.H.I.E.L.D.&lt;/p&gt;&lt;h3 id=&quot;command-title&quot;&gt;Escribe un comando&lt;/h3&gt;&lt;/div&gt;&lt;span class=&quot;game-label&quot;&gt;!help muestra la lista&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;command-feed&quot; id=&quot;command-feed&quot; role=&quot;log&quot; aria-live=&quot;polite&quot; aria-label=&quot;Historial de comandos&quot;&gt;&lt;p class=&quot;command-empty&quot;&gt;Consola lista. Prueba !bal, !op, !pros, !son, !dep o !help.&lt;/p&gt;&lt;/div&gt;
        &lt;p class=&quot;command-response&quot; id=&quot;game-message&quot; aria-live=&quot;polite&quot;&gt;Agente, la consola está lista.&lt;/p&gt;
        &lt;form id=&quot;command-form&quot; class=&quot;command-form command-composer&quot;&gt;
          &lt;label class=&quot;sr-only&quot; for=&quot;command-input&quot;&gt;Escribe un comando&lt;/label&gt;
          &lt;input id=&quot;command-input&quot; class=&quot;game-input&quot; type=&quot;text&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot; placeholder=&quot;Escribe un comando… por ejemplo !bal&quot;&gt;
          &lt;button class=&quot;game-button command-send&quot; type=&quot;submit&quot; aria-label=&quot;Enviar comando&quot;&gt;Enviar&lt;/button&gt;
        &lt;/form&gt;
      &lt;/section&gt;
    &lt;/section&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&quot;mcu-watch-guide&quot;);
      if (!root) return;

      const phases = [
        { id: 1, subtitle: &quot;Los primeros héroes&quot;, gem: &quot;Mente&quot;, color: &quot;#eab308&quot;, description: &quot;Presenta a los héroes fundadores y reúne por primera vez al equipo que cambiará la Tierra.&quot; },
        { id: 2, subtitle: &quot;La expansión de los Vengadores&quot;, gem: &quot;Poder&quot;, color: &quot;#a855f7&quot;, description: &quot;Amplía el universo hacia nuevas organizaciones, amenazas cósmicas y las primeras consecuencias de ser un Vengador.&quot; },
        { id: 3, subtitle: &quot;Civil War y la guerra contra Thanos&quot;, gem: &quot;Espacio&quot;, color: &quot;#3b82f6&quot;, description: &quot;La fractura del equipo y la amenaza de Thanos llevan la Saga del Infinito a su punto culminante.&quot; },
        { id: 4, subtitle: &quot;Después de Endgame&quot;, gem: &quot;Realidad&quot;, color: &quot;#ef4444&quot;, description: &quot;Explora el mundo posterior al Blip y abre nuevas historias, personajes y posibilidades del multiverso.&quot; },
        { id: 5, subtitle: &quot;Nuevas amenazas&quot;, gem: &quot;Tiempo&quot;, color: &quot;#22c55e&quot;, description: &quot;Nuevos equipos se forman mientras amenazas de escala creciente preparan la siguiente gran colisión.&quot; },
        { id: 6, subtitle: &quot;La nueva generación&quot;, gem: &quot;Alma&quot;, color: &quot;#f97316&quot;, description: &quot;Introduce nuevas familias heroicas y continúa expandiendo la Saga del Multiverso.&quot;, upcoming: [{ title: &quot;Avengers: Doomsday&quot;, release: &quot;Estreno previsto · 18 dic. 2026&quot; }, { title: &quot;Avengers: Secret Wars&quot;, release: &quot;Estreno previsto · 17 dic. 2027&quot; }] }
      ];

      const movies = [
        { id: &quot;captain-america-first-avenger&quot;, title: &quot;Captain America: The First Avenger&quot;, era: &quot;1942–1945&quot;, phase: 1 },
        { id: &quot;fantastic-four-first-steps&quot;, title: &quot;The Fantastic Four: First Steps&quot;, era: &quot;1964 · Tierra-828&quot;, phase: 6, special: &quot;Realidad alternativa&quot; },
        { id: &quot;captain-marvel&quot;, title: &quot;Captain Marvel&quot;, era: &quot;1995&quot;, phase: 3 },
        { id: &quot;iron-man&quot;, title: &quot;Iron Man&quot;, era: &quot;2008&quot;, phase: 1 },
        { id: &quot;iron-man-2&quot;, title: &quot;Iron Man 2&quot;, era: &quot;2010&quot;, phase: 1 },
        { id: &quot;incredible-hulk&quot;, title: &quot;The Incredible Hulk&quot;, era: &quot;2010&quot;, phase: 1 },
        { id: &quot;thor&quot;, title: &quot;Thor&quot;, era: &quot;2010&quot;, phase: 1 },
        { id: &quot;avengers&quot;, title: &quot;The Avengers&quot;, era: &quot;2012&quot;, phase: 1 },
        { id: &quot;thor-dark-world&quot;, title: &quot;Thor: The Dark World&quot;, era: &quot;2013&quot;, phase: 2 },
        { id: &quot;iron-man-3&quot;, title: &quot;Iron Man 3&quot;, era: &quot;2013&quot;, phase: 2 },
        { id: &quot;winter-soldier&quot;, title: &quot;Captain America: The Winter Soldier&quot;, era: &quot;2014&quot;, phase: 2 },
        { id: &quot;guardians-1&quot;, title: &quot;Guardians of the Galaxy&quot;, era: &quot;2014&quot;, phase: 2 },
        { id: &quot;guardians-2&quot;, title: &quot;Guardians of the Galaxy Vol. 2&quot;, era: &quot;2014&quot;, phase: 3 },
        { id: &quot;age-of-ultron&quot;, title: &quot;Avengers: Age of Ultron&quot;, era: &quot;2015&quot;, phase: 2 },
        { id: &quot;ant-man&quot;, title: &quot;Ant-Man&quot;, era: &quot;2015&quot;, phase: 2 },
        { id: &quot;civil-war&quot;, title: &quot;Captain America: Civil War&quot;, era: &quot;2016&quot;, phase: 3 },
        { id: &quot;black-widow&quot;, title: &quot;Black Widow&quot;, era: &quot;2016&quot;, phase: 4 },
        { id: &quot;black-panther&quot;, title: &quot;Black Panther&quot;, era: &quot;2016&quot;, phase: 3 },
        { id: &quot;homecoming&quot;, title: &quot;Spider-Man: Homecoming&quot;, era: &quot;2016&quot;, phase: 3 },
        { id: &quot;doctor-strange&quot;, title: &quot;Doctor Strange&quot;, era: &quot;2016–2017&quot;, phase: 3 },
        { id: &quot;thor-ragnarok&quot;, title: &quot;Thor: Ragnarok&quot;, era: &quot;2017&quot;, phase: 3 },
        { id: &quot;ant-man-wasp&quot;, title: &quot;Ant-Man and the Wasp&quot;, era: &quot;2018&quot;, phase: 3 },
        { id: &quot;infinity-war&quot;, title: &quot;Avengers: Infinity War&quot;, era: &quot;2018&quot;, phase: 3 },
        { id: &quot;endgame&quot;, title: &quot;Avengers: Endgame&quot;, era: &quot;2018–2023&quot;, phase: 3 },
        { id: &quot;far-from-home&quot;, title: &quot;Spider-Man: Far From Home&quot;, era: &quot;2024&quot;, phase: 3 },
        { id: &quot;shang-chi&quot;, title: &quot;Shang-Chi and the Legend of the Ten Rings&quot;, era: &quot;2024&quot;, phase: 4 },
        { id: &quot;eternals&quot;, title: &quot;Eternals&quot;, era: &quot;2024&quot;, phase: 4 },
        { id: &quot;no-way-home&quot;, title: &quot;Spider-Man: No Way Home&quot;, era: &quot;2024&quot;, phase: 4 },
        { id: &quot;multiverse-of-madness&quot;, title: &quot;Doctor Strange in the Multiverse of Madness&quot;, era: &quot;2024&quot;, phase: 4 },
        { id: &quot;wakanda-forever&quot;, title: &quot;Black Panther: Wakanda Forever&quot;, era: &quot;2025&quot;, phase: 4 },
        { id: &quot;love-and-thunder&quot;, title: &quot;Thor: Love and Thunder&quot;, era: &quot;2025&quot;, phase: 4 },
        { id: &quot;quantumania&quot;, title: &quot;Ant-Man and the Wasp: Quantumania&quot;, era: &quot;2025&quot;, phase: 5 },
        { id: &quot;guardians-3&quot;, title: &quot;Guardians of the Galaxy Vol. 3&quot;, era: &quot;2026&quot;, phase: 5 },
        { id: &quot;the-marvels&quot;, title: &quot;The Marvels&quot;, era: &quot;2026&quot;, phase: 5 },
        { id: &quot;deadpool-wolverine&quot;, title: &quot;Deadpool &amp; Wolverine&quot;, era: &quot;Multiverso · ubicación aproximada&quot;, phase: 5, special: &quot;Multiverso / TVA&quot; },
        { id: &quot;brave-new-world&quot;, title: &quot;Captain America: Brave New World&quot;, era: &quot;2026–2027&quot;, phase: 5 },
        { id: &quot;thunderbolts&quot;, title: &quot;Thunderbolts*&quot;, era: &quot;2027&quot;, phase: 5 },
        { id: &quot;brand-new-day&quot;, title: &quot;Spider-Man: Brand New Day&quot;, era: &quot;2028&quot;, phase: 6 }
      ];

      const starterWatched = [
        &quot;captain-america-first-avenger&quot;,
        &quot;fantastic-four-first-steps&quot;,
        &quot;captain-marvel&quot;,
        &quot;iron-man&quot;
      ];
      const phaseById = new Map(phases.map((phase) =&gt; [phase.id, phase]));
      const movieById = new Map(movies.map((movie) =&gt; [movie.id, movie]));
      const phaseGrid = root.querySelector(&quot;#phase-grid&quot;);
      const movieList = root.querySelector(&quot;#movie-list&quot;);
      const phaseFilter = root.querySelector(&quot;#phase-filter&quot;);
      const hideWatchedInput = root.querySelector(&quot;#hide-watched&quot;);
      const overallPercent = root.querySelector(&quot;#overall-percent&quot;);
      const seenCount = root.querySelector(&quot;#seen-count&quot;);
      const pendingCount = root.querySelector(&quot;#pending-count&quot;);
      const overallTrack = root.querySelector(&quot;#overall-track&quot;);
      const overallFill = root.querySelector(&quot;#overall-fill&quot;);
      const nextFilm = root.querySelector(&quot;#next-film&quot;);
      const allComplete = root.querySelector(&quot;#all-complete&quot;);
      const sectionTitle = root.querySelector(&quot;#movie-section-title&quot;);
      const sectionSubtitle = root.querySelector(&quot;#movie-section-subtitle&quot;);
      const resultCount = root.querySelector(&quot;#movie-result-count&quot;);
      const emptyMessage = root.querySelector(&quot;#empty-message&quot;);
      const phaseCardById = new Map();
      const movieRowById = new Map();

      const make = (tag, className, text) =&gt; {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const appendGem = (parent, color) =&gt; {
        const gem = make(&quot;span&quot;, &quot;badge-gem&quot;);
        gem.style.setProperty(&quot;--gem-color&quot;, color);
        gem.style.setProperty(&quot;--gem-glow&quot;, color);
        parent.append(gem);
      };

      const createPhaseCard = (phase) =&gt; {
        const card = make(&quot;article&quot;, &quot;phase-card&quot;);
        card.dataset.phaseCard = String(phase.id);
        card.style.setProperty(&quot;--phase-accent&quot;, phase.color);

        const official = make(&quot;div&quot;, &quot;phase-official&quot;, &quot;Marvel Studios · Fase oficial&quot;);
        const number = make(&quot;h3&quot;, &quot;phase-number&quot;, &quot;Fase &quot; + phase.id);
        const descriptive = make(&quot;span&quot;, &quot;descriptive-label&quot;, &quot;Subtítulo descriptivo&quot;);
        const subtitle = make(&quot;h4&quot;, &quot;phase-subtitle&quot;, phase.subtitle);
        const description = make(&quot;p&quot;, &quot;phase-description&quot;, phase.description);
        const progressCopy = make(&quot;div&quot;, &quot;phase-progress-copy&quot;);
        const progressText = make(&quot;span&quot;, &quot;phase-progress-text&quot;, &quot;0 / 0 vistas&quot;);
        const percent = make(&quot;span&quot;, &quot;phase-percent&quot;, &quot;0%&quot;);
        progressCopy.append(progressText, percent);
        const track = make(&quot;div&quot;, &quot;phase-track&quot;);
        track.setAttribute(&quot;role&quot;, &quot;progressbar&quot;);
        track.setAttribute(&quot;aria-label&quot;, &quot;Progreso de la Fase &quot; + phase.id);
        track.setAttribute(&quot;aria-valuemin&quot;, &quot;0&quot;);
        track.setAttribute(&quot;aria-valuemax&quot;, &quot;100&quot;);
        track.setAttribute(&quot;aria-valuenow&quot;, &quot;0&quot;);
        const fill = make(&quot;span&quot;, &quot;phase-fill&quot;);
        track.append(fill);
        const achievement = make(&quot;div&quot;, &quot;phase-achievement&quot;, &quot;&quot;);
        achievement.hidden = true;
        appendGem(achievement, phase.color);
        achievement.append(make(&quot;span&quot;, &quot;achievement-copy&quot;, &quot;Gema de &quot; + phase.gem + &quot; · fase completada&quot;));

        const details = document.createElement(&quot;details&quot;);
        const summary = make(&quot;summary&quot;, &quot;cursor-interaction&quot;, &quot;Ver películas · 0&quot;);
        const list = make(&quot;ol&quot;, &quot;phase-film-list&quot;);
        details.append(summary, list);
        let openNote = null;
        let upcomingList = null;
        if (phase.upcoming &amp;&amp; phase.upcoming.length) {
          openNote = make(&quot;p&quot;, &quot;phase-open-note&quot;, &quot;Fase en curso; los próximos estrenos no cuentan para tu progreso ni para el orden cronológico.&quot;);
          upcomingList = make(&quot;div&quot;, &quot;phase-upcoming&quot;);
          upcomingList.append(make(&quot;p&quot;, &quot;phase-upcoming-title&quot;, &quot;Próximas · cronología interna por confirmar&quot;));
          phase.upcoming.forEach((film) =&gt; {
            const upcoming = make(&quot;div&quot;, &quot;upcoming-film&quot;, film.title);
            upcoming.append(make(&quot;span&quot;, &quot;upcoming-date&quot;, film.release));
            upcomingList.append(upcoming);
          });
        }

        const filterButton = make(&quot;button&quot;, &quot;phase-filter cursor-interaction&quot;, &quot;Ver esta fase&quot;);
        filterButton.type = &quot;button&quot;;
        filterButton.dataset.selectPhase = String(phase.id);
        filterButton.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
        filterButton.addEventListener(&quot;click&quot;, () =&gt; {
          phaseFilter.value = String(phase.id);
          applyView();
          saveState();
        });

        card.append(official, number, descriptive, subtitle, description, progressCopy, track, achievement);
        if (openNote) card.append(openNote);
        card.append(details);
        if (upcomingList) card.append(upcomingList);
        card.append(filterButton);
        phaseGrid.append(card);
        phaseCardById.set(phase.id, { card, progressText, percent, track, fill, achievement, summary, list, filterButton });
      };

      phases.forEach(createPhaseCard);

      const createMovieRow = (movie, index) =&gt; {
        const phase = phaseById.get(movie.phase);
        const row = make(&quot;li&quot;, &quot;movie-row&quot;);
        row.dataset.movieRow = movie.id;
        row.dataset.phase = String(movie.phase);
        row.style.setProperty(&quot;--phase-accent&quot;, phase.color);
        const order = make(&quot;span&quot;, &quot;movie-order&quot;, String(index + 1).padStart(2, &quot;0&quot;));
        const label = make(&quot;label&quot;, &quot;movie-check-label cursor-interaction&quot;);
        const checkbox = make(&quot;input&quot;, &quot;movie-checkbox&quot;);
        checkbox.type = &quot;checkbox&quot;;
        checkbox.dataset.movieId = movie.id;
        checkbox.setAttribute(&quot;aria-label&quot;, &quot;Marcar como vista: &quot; + movie.title);
        const copy = make(&quot;span&quot;, &quot;movie-copy&quot;);
        const titleLine = make(&quot;span&quot;, &quot;movie-title-line&quot;);
        const title = make(&quot;span&quot;, &quot;movie-title&quot;, movie.title);
        const status = make(&quot;span&quot;, &quot;movie-status&quot;, &quot;Pendiente&quot;);
        titleLine.append(title, status);
        const meta = make(&quot;span&quot;, &quot;movie-meta-line&quot;);
        const era = make(&quot;span&quot;, &quot;movie-era&quot;, &quot;Historia · &quot; + movie.era);
        const phaseTag = make(&quot;span&quot;, &quot;movie-phase&quot;, &quot;Fase &quot; + movie.phase);
        meta.append(era, phaseTag);
        if (movie.special) meta.append(make(&quot;span&quot;, &quot;movie-special&quot;, movie.special));
        copy.append(titleLine, meta);
        label.append(checkbox, copy);
        row.append(order, label);
        movieList.append(row);
        movieRowById.set(movie.id, { row, checkbox, status });
      };

      movies.forEach(createMovieRow);

      const parseObject = (value) =&gt; {
        if (typeof value === &quot;string&quot;) {
          try {
            return JSON.parse(value);
          } catch {
            return null;
          }
        }
        return value &amp;&amp; typeof value === &quot;object&quot; ? value : null;
      };

      const readState = (state) =&gt; {
        const model = state ? parseObject(state.modelContent) : null;
        const privateState = state ? parseObject(state.privateContent) : null;
        const saved = model &amp;&amp; Array.isArray(model.watched)
          ? new Set(model.watched.filter((id) =&gt; movieById.has(id)))
          : null;
        return {
          watched: saved,
          game: model &amp;&amp; model.game &amp;&amp; typeof model.game === &quot;object&quot; ? model.game : null,
          phase: privateState &amp;&amp; [&quot;all&quot;, &quot;1&quot;, &quot;2&quot;, &quot;3&quot;, &quot;4&quot;, &quot;5&quot;, &quot;6&quot;].includes(String(privateState.phase))
            ? String(privateState.phase)
            : &quot;all&quot;,
          hideWatched: Boolean(privateState &amp;&amp; privateState.hideWatched)
        };
      };

      const initialState = readState(window.openai &amp;&amp; window.openai.widgetState);
      let watched = initialState.watched || new Set(starterWatched);
      window.__mcuGameState = initialState.game;
      phaseFilter.value = initialState.phase;
      hideWatchedInput.checked = initialState.hideWatched;

      const updatePhaseCards = () =&gt; {
        phases.forEach((phase) =&gt; {
          const view = phaseCardById.get(phase.id);
          const phaseMovies = movies.filter((movie) =&gt; movie.phase === phase.id);
          const phaseSeen = phaseMovies.filter((movie) =&gt; watched.has(movie.id)).length;
          const percentValue = phaseMovies.length ? Math.round((phaseSeen / phaseMovies.length) * 100) : 0;
          view.progressText.textContent = phaseSeen + &quot; / &quot; + phaseMovies.length + &quot; vistas&quot;;
          view.percent.textContent = percentValue + &quot;%&quot;;
          view.track.setAttribute(&quot;aria-valuenow&quot;, String(percentValue));
          view.fill.style.width = percentValue + &quot;%&quot;;
          view.achievement.hidden = phaseSeen !== phaseMovies.length || Boolean(phase.upcoming &amp;&amp; phase.upcoming.length);
          view.summary.textContent = &quot;Ver películas del tracker · &quot; + phaseMovies.length;
          view.list.replaceChildren();
          phaseMovies.forEach((movie) =&gt; {
            const item = make(&quot;li&quot;, &quot;&quot;);
            item.append(make(&quot;span&quot;, &quot;phase-film-title&quot;, movie.title));
            const era = make(&quot;span&quot;, &quot;phase-film-era&quot;, &quot;Cronología · &quot; + movie.era);
            item.append(era);
            if (movie.special) item.append(make(&quot;span&quot;, &quot;phase-film-era&quot;, movie.special));
            view.list.append(item);
          });
          const selected = phaseFilter.value === String(phase.id);
          view.filterButton.setAttribute(&quot;aria-pressed&quot;, String(selected));
          view.card.classList.toggle(&quot;is-selected&quot;, selected);
        });
      };

      const applyView = () =&gt; {
        const filterPhase = phaseFilter.value === &quot;all&quot; ? null : Number(phaseFilter.value);
        const selectedPhase = filterPhase ? phaseById.get(filterPhase) : null;
        const matchingMovies = movies.filter((movie) =&gt; !filterPhase || movie.phase === filterPhase);
        let visibleCount = 0;

        movies.forEach((movie) =&gt; {
          const view = movieRowById.get(movie.id);
          const isWatched = watched.has(movie.id);
          view.checkbox.checked = isWatched;
          view.row.classList.toggle(&quot;is-watched&quot;, isWatched);
          view.status.textContent = isWatched ? &quot;Vista&quot; : &quot;Pendiente&quot;;
          const matchesPhase = !filterPhase || movie.phase === filterPhase;
          const hiddenWatched = hideWatchedInput.checked &amp;&amp; isWatched;
          view.row.hidden = !matchesPhase || hiddenWatched;
          if (!view.row.hidden) visibleCount += 1;
        });

        const completeCount = watched.size;
        const pending = movies.length - completeCount;
        const percentValue = Math.round((completeCount / movies.length) * 100);
        overallPercent.textContent = percentValue + &quot;%&quot;;
        seenCount.textContent = completeCount + &quot; / &quot; + movies.length;
        pendingCount.textContent = String(pending);
        overallTrack.setAttribute(&quot;aria-valuenow&quot;, String(completeCount));
        overallFill.style.width = (completeCount / movies.length * 100) + &quot;%&quot;;
        allComplete.hidden = completeCount !== movies.length;

        if (selectedPhase) {
          sectionTitle.textContent = &quot;Fase &quot; + selectedPhase.id + &quot; · &quot; + selectedPhase.subtitle;
          sectionSubtitle.textContent = &quot;Películas de esta fase, en el orden cronológico interno de la guía.&quot;;
        } else {
          sectionTitle.textContent = &quot;Cronología de la historia&quot;;
          sectionSubtitle.textContent = &quot;Todas las películas conservan el orden cronológico de la guía; no es el orden de estreno.&quot;;
        }
        resultCount.textContent = visibleCount + (visibleCount === 1 ? &quot; película visible&quot; : &quot; películas visibles&quot;);
        emptyMessage.hidden = visibleCount !== 0;
        movieList.hidden = visibleCount === 0;

        const next = matchingMovies.find((movie) =&gt; !watched.has(movie.id));
        if (next) {
          nextFilm.innerHTML = &quot;&quot;;
          nextFilm.append(make(&quot;strong&quot;, &quot;&quot;, &quot;Siguiente pendiente: &quot;));
          nextFilm.append(document.createTextNode(next.title));
        } else if (selectedPhase) {
          nextFilm.textContent = &quot;No quedan películas pendientes en esta fase.&quot;;
        } else {
          nextFilm.textContent = &quot;Has completado todas las películas de la guía.&quot;;
        }
        updatePhaseCards();
      };

      const saveState = () =&gt; {
        if (window.openai &amp;&amp; typeof window.openai.setWidgetState === &quot;function&quot;) {
          window.openai.setWidgetState({
            modelContent: { watched: Array.from(watched), game: window.__mcuGameState || null },
            privateContent: { phase: phaseFilter.value, hideWatched: hideWatchedInput.checked }
          }).catch(() =&gt; {});
        }
      };

      window.addEventListener(&quot;mcu:game-save&quot;, saveState);

      movieList.addEventListener(&quot;change&quot;, (event) =&gt; {
        const target = event.target;
        if (!target || !target.matches(&quot;[data-movie-id]&quot;)) return;
        watched = new Set(movies.filter((movie) =&gt; movieRowById.get(movie.id).checkbox.checked).map((movie) =&gt; movie.id));
        applyView();
        saveState();

      const ensureDaily = () =&gt; {

      const eligibleZones = (kind) =&gt; zones[kind].filter((zone) =&gt; seenMovies.has(zone.movie));

      const addBalance = (amount) =&gt; { game.balance = Math.max(0, game.balance + amount); };

      const movieSeen = (id) =&gt; seenMovies.has(id);

          const firstOpen = available.find((zone) =&gt; getLevel() &gt;= zone.level);

        const fill = root.querySelector(&quot;.xp-track span&quot;);
        fill.style.width = `${Math.round((xpInLevel() / 250) * 100)}%`;
        root.querySelector(&quot;.xp-track&quot;).setAttribute(&quot;aria-valuenow&quot;, String(xpInLevel()));
      };

      const renderZonesAndCompanions = () =&gt; {
        renderSelect($(&quot;#prospect-zone&quot;), eligibleZones(&quot;prospect&quot;), &quot;Elige una zona de búsqueda&quot;);
        renderSelect($(&quot;#sonar-zone&quot;), eligibleZones(&quot;sonar&quot;), &quot;Elige una zona de exploración&quot;);
        renderSelect($(&quot;#deploy-zone&quot;), eligibleZones(&quot;deploy&quot;), &quot;Elige una zona de misión&quot;);
        const companionSelect = $(&quot;#deploy-companion&quot;);
        const old = companionSelect.value;
        companionSelect.replaceChildren();
        const placeholder = document.createElement(&quot;option&quot;);
        placeholder.value = &quot;&quot;;
        placeholder.textContent = game.companions.length ? &quot;Elige un aliado&quot; : &quot;Marca una película como vista para desbloquear un aliado&quot;;
        companionSelect.append(placeholder);
        game.companions.forEach((companion) =&gt; {
          const info = companionInfo(companion.id);
          if (!info) return;
          const option = document.createElement(&quot;option&quot;);
          option.value = companion.id;
          option.textContent = `${info.name} · Nv. ${companion.level || 1} · ${info.role}`;
          companionSelect.append(option);
        });
        if (game.companions.some((companion) =&gt; companion.id === old)) companionSelect.value = old;
        else if (game.companions.length) companionSelect.value = game.companions[0].id;
        companionSelect.disabled = !game.companions.length || Boolean(game.expedition);
      };

      const renderQuests = () =&gt; {
        ensureDaily();
        const list = $(&quot;#quest-list&quot;);
        list.replaceChildren();
        quests.forEach((quest) =&gt; {
          const accepted = game.daily.accepted.includes(quest.id);
          const claimed = game.daily.claimed.includes(quest.id);
          const progress = Math.min(quest.goal, Number(game.daily.progress[quest.id] || 0));
          const row = document.createElement(&quot;div&quot;);
          row.className = `quest-row${claimed ? &quot; is-claimed&quot; : &quot;&quot;}`;
          const copy = document.createElement(&quot;div&quot;);
          copy.className = &quot;quest-copy&quot;;
          const title = document.createElement(&quot;strong&quot;);
          title.textContent = quest.name;
          const description = document.createElement(&quot;span&quot;);
          description.textContent = `${quest.text} Recompensa: ${quest.credits} créditos, ${quest.xp} XP y una caja.`;
          copy.append(title, description);
          const action = document.createElement(&quot;button&quot;);
          action.type = &quot;button&quot;;
          action.className = &quot;text-button&quot;;
          action.dataset.questAction = claimed ? &quot;claimed&quot; : accepted &amp;&amp; progress &gt;= quest.goal ? &quot;claim&quot; : accepted ? &quot;active&quot; : &quot;accept&quot;;
          action.dataset.questId = quest.id;
          action.textContent = claimed ? &quot;Reclamada&quot; : accepted &amp;&amp; progress &gt;= quest.goal ? &quot;Reclamar&quot; : accepted ? &quot;En curso&quot; : game.daily.accepted.length - game.daily.claimed.length &gt;= 2 ? &quot;Sin espacios&quot; : &quot;Aceptar&quot;;
          action.disabled = claimed || action.dataset.questAction === &quot;active&quot; || action.textContent === &quot;Sin espacios&quot;;
          const progressText = document.createElement(&quot;span&quot;);
          progressText.className = &quot;quest-progress&quot;;
          progressText.textContent = `${progress}/${quest.goal}`;
          row.append(copy, progressText, action);
          list.append(row);
        });
      };

      const itemAction = (id) =&gt; itemCatalog[id] &amp;&amp; itemCatalog[id].type === &quot;box&quot; ? &quot;Abrir&quot; : itemCatalog[id] &amp;&amp; itemCatalog[id].type === &quot;buff&quot; ? &quot;Usar&quot; : &quot;&quot;;
      const makeItemRow = (id, quantity) =&gt; {
        const meta = itemCatalog[id];
        const row = document.createElement(&quot;div&quot;);
        row.className = &quot;inventory-item&quot;;
        row.dataset.itemType = meta.type;
        const copy = document.createElement(&quot;div&quot;);
        copy.className = &quot;item-copy&quot;;
        const name = document.createElement(&quot;strong&quot;);
        name.textContent = `${meta.icon} ${meta.name}`;
        const description = document.createElement(&quot;span&quot;);
        description.textContent = meta.description;
        copy.append(name, description);
        const controls = document.createElement(&quot;div&quot;);
        controls.className = &quot;shop-price&quot;;
        const count = document.createElement(&quot;span&quot;);
        count.className = &quot;item-quantity&quot;;
        count.textContent = `×${quantity}`;
        controls.append(count);
        const actionName = itemAction(id);
        if (actionName) {
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;text-button&quot;;
          button.dataset.itemAction = actionName === &quot;Abrir&quot; ? &quot;open&quot; : &quot;use&quot;;
          button.dataset.itemId = id;
          button.textContent = actionName;
          controls.append(button);
        }
        row.append(copy, controls);
        return row;
      };
      const renderInventory = () =&gt; {
        const filter = $(&quot;#inventory-filter&quot;).value;
        const grid = $(&quot;#inventory-grid&quot;);
        const activeBuffs = $(&quot;#active-buffs&quot;);
        grid.replaceChildren();
        activeBuffs.replaceChildren();
        const active = Object.entries(game.buffs).filter(([, endAt]) =&gt; Number(endAt) &gt; now());
        active.forEach(([id, endAt]) =&gt; {
          const meta = itemCatalog[id];
          if (!meta) return;
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;buff-row&quot;;
          row.dataset.buffId = id;
          const copy = document.createElement(&quot;div&quot;);
          copy.className = &quot;item-copy&quot;;
          const name = document.createElement(&quot;strong&quot;);
          name.textContent = `${meta.icon} ${meta.name}`;
          const time = document.createElement(&quot;span&quot;);
          time.className = &quot;buff-time&quot;;
          time.dataset.buffTime = String(endAt);
          copy.append(name, time);
          row.append(copy);
          activeBuffs.append(row);
        });
        if (filter === &quot;all&quot; || filter === &quot;buff&quot;) {
          Object.keys(itemCatalog).forEach((id) =&gt; {
            const meta = itemCatalog[id];
            if (meta.type !== &quot;buff&quot; || itemCount(id) &lt;= 0) return;
            grid.append(makeItemRow(id, itemCount(id)));
          });
        }
        Object.keys(itemCatalog).forEach((id) =&gt; {
          const meta = itemCatalog[id];
          if (meta.type === &quot;buff&quot; || ![&quot;all&quot;, meta.type].includes(filter) || itemCount(id) &lt;= 0) return;
          grid.append(makeItemRow(id, itemCount(id)));
        });
        if (filter === &quot;all&quot; || filter === &quot;gear&quot;) {
          [
            { name: &quot;Escáner de campo Stark&quot;, level: game.equipment.scanner, text: &quot;Equipo para la prospección.&quot; },
            { name: &quot;Receptor sónico&quot;, level: game.equipment.sonar, text: &quot;Equipo para el sonar.&quot; }
          ].forEach((item) =&gt; {
            const row = document.createElement(&quot;div&quot;);
            row.className = &quot;inventory-item&quot;;
            row.dataset.itemType = &quot;gear&quot;;
            const copy = document.createElement(&quot;div&quot;); copy.className = &quot;item-copy&quot;;
            const title = document.createElement(&quot;strong&quot;); title.textContent = `⌁ ${item.name} Mk ${item.level}`;
            const text = document.createElement(&quot;span&quot;); text.textContent = item.text;
            copy.append(title, text);
            const count = document.createElement(&quot;span&quot;); count.className = &quot;item-quantity&quot;; count.textContent = &quot;Equipado&quot;;
            row.append(copy, count); grid.append(row);
          });
        }
        if (filter === &quot;all&quot; || filter === &quot;companion&quot;) {
          game.companions.forEach((companion) =&gt; {
            const info = companionInfo(companion.id);
            if (!info) return;
            const row = document.createElement(&quot;div&quot;); row.className = &quot;inventory-item&quot;; row.dataset.itemType = &quot;companion&quot;;
            const copy = document.createElement(&quot;div&quot;); copy.className = &quot;item-copy&quot;;
            const title = document.createElement(&quot;strong&quot;); title.textContent = `✧ ${info.name} · Nivel ${companion.level || 1}`;
            const detail = document.createElement(&quot;span&quot;); detail.textContent = `${info.role}. ${info.specialty}`;
            copy.append(title, detail); row.append(copy); grid.append(row);
          });
        }
        if (!grid.children.length) {
          const empty = document.createElement(&quot;div&quot;); empty.className = &quot;empty-inventory&quot;;
          empty.textContent = filter === &quot;relic&quot; ? &quot;Aún no has recuperado reliquias. Explora zonas cósmicas o de realidades alternativas.&quot; : &quot;Todavía no hay objetos en esta categoría. Las misiones pueden traer nuevos hallazgos.&quot;;
          grid.append(empty);
        }
        updateTimers();
      };

      const renderShop = () =&gt; {
        const shop = $(&quot;#shop-grid&quot;);
        shop.replaceChildren();
        shopItems.forEach((item) =&gt; {
          const row = document.createElement(&quot;div&quot;); row.className = &quot;shop-row&quot;;
          const copy = document.createElement(&quot;div&quot;); copy.className = &quot;item-copy&quot;;
          const title = document.createElement(&quot;strong&quot;); title.textContent = `${item.icon || &quot;✦&quot;} ${item.name}`;
          const description = document.createElement(&quot;span&quot;); description.textContent = item.text;
          copy.append(title, description);
          const controls = document.createElement(&quot;div&quot;); controls.className = &quot;shop-price&quot;;
          const price = document.createElement(&quot;span&quot;); price.textContent = `${fmt(item.price)} créditos`;
          const button = document.createElement(&quot;button&quot;); button.type = &quot;button&quot;; button.className = &quot;text-button&quot;; button.dataset.buyItem = item.id;
          const owned = item.type === &quot;gear&quot; &amp;&amp; Number(game.equipment[item.key] || 1) &gt;= item.max;
          button.textContent = owned ? &quot;Nivel máximo&quot; : &quot;Comprar&quot;;
          button.disabled = owned || game.balance &lt; item.price;
          controls.append(price, button); row.append(copy, controls); shop.append(row);
        });
        const recipeList = $(&quot;#recipe-grid&quot;);
        recipeList.replaceChildren();
        const visibleRecipes = recipes.filter((recipe) =&gt; movieSeen(recipe.movie));
        visibleRecipes.forEach((recipe) =&gt; {
          const product = itemCatalog[recipe.product];
          const row = document.createElement(&quot;div&quot;); row.className = &quot;recipe-row&quot;;
          const copy = document.createElement(&quot;div&quot;); copy.className = &quot;item-copy&quot;;
          const title = document.createElement(&quot;strong&quot;); title.textContent = `${product.icon} ${recipe.name}`;
          const ingredients = document.createElement(&quot;span&quot;);
          ingredients.textContent = `Materiales: ${Object.entries(recipe.ingredients).map(([id, qty]) =&gt; `${itemCatalog[id].icon} ${itemCatalog[id].name} ×${qty}`).join(&quot; · &quot;)} · ${fmt(recipe.cost)} créditos`;
          copy.append(title, ingredients);
          const button = document.createElement(&quot;button&quot;); button.type = &quot;button&quot;; button.className = &quot;text-button&quot;; button.dataset.craftItem = recipe.id; button.textContent = &quot;Fabricar&quot;;
          const enough = game.balance &gt;= recipe.cost &amp;&amp; Object.entries(recipe.ingredients).every(([id, qty]) =&gt; itemCount(id) &gt;= qty);
          button.disabled = !enough;
          row.append(copy, button); recipeList.append(row);
        });
        if (!visibleRecipes.length) {
          const empty = document.createElement(&quot;div&quot;); empty.className = &quot;empty-inventory&quot;; empty.textContent = &quot;Los planos se desbloquean al marcar sus películas como vistas.&quot;; recipeList.append(empty);
        }
      };

      const renderChallenge = () =&gt; {
        const operation = $(&quot;#operation-challenge&quot;);
        operation.replaceChildren();
        operation.hidden = !game.pendingOperation;
        if (game.pendingOperation) {
          const prompt = document.createElement(&quot;div&quot;); prompt.textContent = game.pendingOperation.prompt;
          const sequence = document.createElement(&quot;strong&quot;); sequence.textContent = game.pendingOperation.sequence;
          const choices = document.createElement(&quot;div&quot;); choices.className = &quot;challenge-options&quot;;
          game.pendingOperation.choices.forEach((choice, index) =&gt; {
            const button = document.createElement(&quot;button&quot;); button.type = &quot;button&quot;; button.className = &quot;text-button&quot;; button.dataset.operationAnswer = String(index); button.textContent = choice;
            choices.append(button);
          });
          operation.append(prompt, sequence, choices);
        }
        const sonar = $(&quot;#sonar-challenge&quot;);
        sonar.replaceChildren();
        sonar.hidden = !game.pendingSonar;
        if (game.pendingSonar) {
          const prompt = document.createElement(&quot;div&quot;); prompt.textContent = &quot;Señal detectada. Elige la frecuencia con la respuesta más intensa.&quot;;
          const choices = document.createElement(&quot;div&quot;); choices.className = &quot;challenge-options&quot;;
          [1, 2, 3].forEach((band) =&gt; {
            const button = document.createElement(&quot;button&quot;); button.type = &quot;button&quot;; button.className = &quot;text-button&quot;; button.dataset.sonarAnswer = String(band); button.textContent = `Frecuencia ${band}`;
            choices.append(button);
          });
          sonar.append(prompt, choices);
        }
      };

      const renderAll = () =&gt; {
        ensureDaily();
        renderStats();
        renderZonesAndCompanions();
        renderQuests();
        renderChallenge();
        renderInventory();
        renderShop();
        updateTimers();
        if ($( &quot;#game-message&quot;)) $(&quot;#game-message&quot;).textContent = pendingNotice;
      };

      const currentZone = (kind, select) =&gt; visibleZone(kind, select.value);
      const startCooldown = (id) =&gt; { game.cooldowns[id] = now() + cooldownDuration(id); };
      const operationPrompts = [
        { prompt: &quot;Consola Stark · descifra la secuencia de energía:&quot;, sequence: &quot;2 · 4 · 8 · ?&quot;, choices: [&quot;12&quot;, &quot;16&quot;, &quot;18&quot;], answer: 1 },
        { prompt: &quot;Consola Stark · completa el patrón de señal:&quot;, sequence: &quot;3 · 6 · 12 · ?&quot;, choices: [&quot;18&quot;, &quot;21&quot;, &quot;24&quot;], answer: 2 },
        { prompt: &quot;Cifrado de S.H.I.E.L.D. · elige el siguiente número:&quot;, sequence: &quot;1 · 1 · 2 · 3 · 5 · ?&quot;, choices: [&quot;8&quot;, &quot;9&quot;, &quot;10&quot;], answer: 0 },
        { prompt: &quot;Consola de campo · completa la señal alternada:&quot;, sequence: &quot;ESPACIO · TIEMPO · ESPACIO · ?&quot;, choices: [&quot;PODER&quot;, &quot;TIEMPO&quot;, &quot;ESPACIO&quot;], answer: 1 }
      ];
      const startOperation = () =&gt; {
        if (game.pendingOperation) { setMessage(&quot;Completa primero el reto activo de la consola.&quot;); return; }
        if (remaining(&quot;operation&quot;)) { setMessage(`La próxima operación estará disponible en ${niceTime(remaining(&quot;operation&quot;))}.`); return; }
        const question = operationPrompts[randomInt(0, operationPrompts.length - 1)];
        game.pendingOperation = { ...question };
        startCooldown(&quot;operation&quot;);
        setMessage(&quot;Operación iniciada. Resuelve el reto de la consola para completar el informe.&quot;);
        persist(); renderAll();
      };
      const finishOperation = (answer) =&gt; {
        if (!game.pendingOperation) return;
        const success = Number(answer) === Number(game.pendingOperation.answer);
        game.pendingOperation = null;
        const credits = success ? randomInt(90, 140) : randomInt(25, 45);
        const xp = success ? randomInt(55, 80) : randomInt(15, 28);
        addBalance(credits); addXp(xp); updateQuestProgress(&quot;operation&quot;);
        if (success &amp;&amp; Math.random() &lt; 0.1) grantItem(&quot;shield_supply&quot;);
        addLog(success ? &quot;Operación de S.H.I.E.L.D. completada&quot; : &quot;Operación de S.H.I.E.L.D.: datos parciales recuperados&quot;);
        setMessage(success ? `Señal descifrada: +${credits} créditos y +${xp} XP.` : `Señal incompleta. Aun así, recuperaste ${credits} créditos y ${xp} XP.`);
        persist(); renderAll();
      };

      const startProspecting = () =&gt; {
        const zone = currentZone(&quot;prospect&quot;, $(&quot;#prospect-zone&quot;));
        if (!zone) { setMessage(&quot;Elige una zona desbloqueada. Aparecerán nuevos lugares al marcar sus películas como vistas.&quot;); return; }
        if (remaining(&quot;prospect&quot;)) { setMessage(`La próxima prospección estará disponible en ${niceTime(remaining(&quot;prospect&quot;))}.`); return; }
        startCooldown(&quot;prospect&quot;);
        const deep = $(&quot;#prospect-route&quot;).value === &quot;deep&quot;;
        const risk = zone.risk + (deep ? 0.12 : 0);
        const setback = Math.random() &lt; risk;
        const scannerBonus = Math.max(0, Number(game.equipment.scanner || 1) - 1) * 0.04;
        const rareChance = Math.min(0.55, 0.08 + scannerBonus + (deep ? 0.12 : 0) + (hasBuff(&quot;stark_light&quot;) ? 0.16 : 0));
        const credits = setback ? randomInt(10, 25) : deep ? randomInt(55, 95) : randomInt(28, 55);
        const xp = setback ? 12 : deep ? randomInt(32, 48) : randomInt(20, 34);
        addBalance(credits); addXp(xp);
        grantItem(setback ? &quot;scrap_alloy&quot; : zone.material, deep &amp;&amp; !setback ? 2 : 1);
        if (!setback &amp;&amp; Math.random() &lt; rareChance) grantItem(&quot;stark_case&quot;);
        updateQuestProgress(&quot;prospect&quot;);
        addLog(`${zone.name}: ${setback ? &quot;regreso anticipado&quot; : &quot;materiales recuperados&quot;}`);
        setMessage(setback ? `Una falla inestable obligó al equipo a volver antes. Conservas tus hallazgos: +${credits} créditos y +${xp} XP.` : `Zona explorada: ${zone.name}. Recuperaste ${itemCatalog[zone.material].name} y ${credits} créditos.`);
        persist(); renderAll();
      };

      const startSonar = () =&gt; {
        const zone = currentZone(&quot;sonar&quot;, $(&quot;#sonar-zone&quot;));
        if (!zone) { setMessage(&quot;Elige una zona de exploración desbloqueada. Aparecerán nuevos lugares al marcar sus películas como vistas.&quot;); return; }
        if (game.pendingSonar) { setMessage(&quot;Elige una frecuencia para la señal de sonar activa.&quot;); return; }
        if (remaining(&quot;sonar&quot;)) { setMessage(`El próximo barrido de sonar estará disponible en ${niceTime(remaining(&quot;sonar&quot;))}.`); return; }
        game.pendingSonar = { zoneId: zone.id, band: randomInt(1, 3) };
        startCooldown(&quot;sonar&quot;);
        setMessage(&quot;Señal detectada. Elige una frecuencia para localizarla.&quot;);
        persist(); renderAll();
      };
      const finishSonar = (band) =&gt; {
        if (!game.pendingSonar) return;
        const zone = zones.sonar.find((entry) =&gt; entry.id === game.pendingSonar.zoneId);
        if (!zone) { game.pendingSonar = null; persist(); renderAll(); return; }
        const success = Number(band) === Number(game.pendingSonar.band);
        game.pendingSonar = null;
        const sonarBonus = Math.max(0, Number(game.equipment.sonar || 1) - 1) * 0.04;
        const rareChance = Math.min(0.55, 0.08 + sonarBonus + (hasBuff(&quot;biolum_lure&quot;) ? 0.16 : 0) + (success ? 0.1 : 0));
        const credits = success ? randomInt(55, 90) : randomInt(18, 38);
        const xp = success ? randomInt(35, 55) : randomInt(12, 25);
        addBalance(credits); addXp(xp); grantItem(zone.material);
        if (success &amp;&amp; Math.random() &lt; rareChance) grantItem(&quot;talokan_crate&quot;);
        updateQuestProgress(&quot;sonar&quot;);
        addLog(`${zone.name}: ${success ? &quot;señal localizada&quot; : &quot;señal parcialmente localizada&quot;}`);
        setMessage(success ? `Frecuencia correcta. Recuperaste ${itemCatalog[zone.material].name}, ${credits} créditos y ${xp} XP.` : `La señal se debilitó, pero el barrido recuperó ${itemCatalog[zone.material].name}, ${credits} créditos y ${xp} XP.`);
        persist(); renderAll();
      };

      const startDeployment = () =&gt; {
        if (game.expedition) {
          if (now() &gt;= Number(game.expedition.endsAt)) claimDeployment();
          else setMessage(`El equipo de campo regresará en ${niceTime(Number(game.expedition.endsAt) - now())}.`);
          return;
        }
        const companion = getCompanion($(&quot;#deploy-companion&quot;).value);
        const zone = currentZone(&quot;deploy&quot;, $(&quot;#deploy-zone&quot;));
        if (!companion || !zone) { setMessage(&quot;Elige un aliado y una zona de misión desbloqueada.&quot;); return; }
        const haste = hasBuff(&quot;deployment_beacon&quot;);
        const duration = (haste ? 15 : 30) * 60_000;
        game.expedition = { companionId: companion.id, zoneId: zone.id, approach: $(&quot;#deploy-approach&quot;).value, startedAt: now(), endsAt: now() + duration };
        setMessage(`${companionInfo(companion.id).name} salió hacia ${zone.name}. Regresará en ${haste ? 15 : 30} minutos.`);
        addLog(`${companionInfo(companion.id).name} enviado a ${zone.name}`);
        persist(); renderAll();
      };
      const claimDeployment = () =&gt; {
        if (!game.expedition) return;
        const mission = game.expedition;
        if (now() &lt; Number(mission.endsAt)) { setMessage(`El equipo de campo regresará en ${niceTime(Number(mission.endsAt) - now())}.`); return; }
        const zone = zones.deploy.find((entry) =&gt; entry.id === mission.zoneId);
        const companion = getCompanion(mission.companionId);
        const info = companionInfo(mission.companionId);
        if (!zone || !companion || !info) { game.expedition = null; persist(); renderAll(); return; }
        const safeBonus = mission.approach === &quot;recon&quot; ? 0.12 : 0;
        const roleBonus = info.role === &quot;Guardián&quot; ? 0.08 : 0;
        const success = Math.random() &lt; Math.min(0.97, 0.78 + safeBonus + roleBonus - zone.risk);
        const credits = success ? randomInt(75, 125) : randomInt(20, 48);
        const xp = success ? randomInt(45, 70) : randomInt(16, 30);
        addBalance(credits); addXp(xp); addCompanionXp(companion, success ? 50 : 25);
        grantItem(success ? zone.material : &quot;scrap_alloy&quot;);
        const scoutBonus = info.role === &quot;Exploradora&quot; || info.role === &quot;Navegante&quot; ? 0.1 : 0;
        const crateChance = (mission.approach === &quot;recovery&quot; ? 0.24 : 0.12) + scoutBonus;
        if (Math.random() &lt; crateChance) grantItem(&quot;field_kit&quot;);
        game.expedition = null;
        updateQuestProgress(&quot;deploy&quot;);
        addLog(`${info.name} regresó de ${zone.name}`);
        setMessage(success ? `${info.name} volvió con ${itemCatalog[zone.material].name}, ${credits} créditos y ${xp} XP.` : `${info.name} regresó con algunos materiales: ${credits} créditos y ${xp} XP.`);
        persist(); renderAll();
      };

      const buffDuration = {
        chronal_accelerator: 30 * 60_000,
        deployment_beacon: 60 * 60_000,
        stark_light: 60 * 60_000,
        biolum_lure: 60 * 60_000,
        cosmic_xp: 12 * 60 * 60_000,
        rocket_ration: 12 * 60 * 60_000
      };
      const useBuff = (id) =&gt; {
        if (!itemCatalog[id] || itemCatalog[id].type !== &quot;buff&quot; || !spendItem(id)) { setMessage(&quot;No tienes esa mejora en el inventario.&quot;); return; }
        game.buffs[id] = now() + buffDuration[id];
        setMessage(`Activaste: ${itemCatalog[id].name}.`);
        addLog(`Mejora activada: ${itemCatalog[id].name}`);

      const normalizeCommand = (value) =&gt; String(value || &quot;&quot;).trim().toLowerCase().replace(/^!/, &quot;&quot;);
